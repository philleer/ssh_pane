[package]
name = "ssh_split_pane"
version = "0.1.0"
edition = "2021"
description = "Remote dual-pane file manager: drag to cp/mv over SSH"
license = "MIT"
authors = ["ssh_split_pane"]

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts"] }
egui = "0.29"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Faster day-to-day builds: optimize dependencies (egui/ssh2) while keeping
# our crates at opt-level 0 for quick incremental recompiles.
[profile.dev.package."*"]
opt-level = 2

# Default release: thin LTO — much faster to link than fat LTO, still small/fast.
[profile.release]
lto = "thin"
codegen-units = 8
strip = true

# Shipping / size-sensitive builds: `cargo build --profile dist`
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
