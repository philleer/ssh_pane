[package]
name = "ssh_pane"
version = "0.1.3"
edition = "2021"
description = "Remote dual-pane file manager: drag to cp/mv over SSH"
license = "MIT"
authors = ["phillee <phillee2016@163.com>"]
readme = "README.md"
keywords = ["ssh", "sftp", "file-manager", "dual-pane", "egui"]
categories = ["gui", "network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts"] }
egui = "0.29"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Faster day-to-day builds: optimize dependencies (egui/ssh2) while keeping
# our crates at opt-level 0 for quick incremental recompiles.
[profile.dev.package."*"]
opt-level = 2

# Default release: thin LTO — much faster to link than fat LTO, still small/fast.
# Note: Cargo disables incremental for `release`, so a one-crate edit still
# pays a full thin-LTO link (~30s here). Prefer `dev` or `--profile rel` while iterating.
[profile.release]
lto = "thin"
codegen-units = 8
strip = true

# Fast “almost release” for local UI iteration: opt-level 3, no LTO, incremental on.
# Expect ~few seconds after the first build, vs ~30s+ for `cargo build --release`.
[profile.rel]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Shipping / size-sensitive builds: `cargo build --profile dist`
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
